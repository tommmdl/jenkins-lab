services:
  jenkins:
    build: .
    image: jenkins-lab:local
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    secrets:
      - admin_password
    restart: unless-stopped
secrets:
  admin_password:
    file: .local/admin-password
volumes:
  jenkins_home:
